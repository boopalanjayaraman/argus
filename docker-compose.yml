# Argus container deployment.
#   cp .env.example .env   # fill credentials, then:
#   docker compose up --build
# Services: mongo, api (web+API :8000), orchestrator (:8100),
# video-agent (:8101), image-agent (:8102), pointcloud-agent (:8103).
# Each sub-agent is its own container/process and restarts independently.
name: argus

services:
  # Local Mongo is opt-in only: `docker compose --profile local-mongo up mongo`
  # Default local runs use MongoDB Atlas via MONGODB_URI from .env.
  mongo:
    image: mongo:7
    profiles: ["local-mongo"]
    volumes:
      - argus-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 3s
      retries: 10

  video-agent:
    build: { context: ., dockerfile: Dockerfile.inspection }
    command: ["python", "agent_service.py", "video", "8101"]
    environment: &agent-env
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOG_NAME: ${GCP_LOG_NAME:-argus}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      META_API_KEY: ${META_API_KEY:-}
      META_ADAPTER_LIVE: ${META_ADAPTER_LIVE:-}
      META_SCREEN_MODEL: ${META_SCREEN_MODEL:-muse-spark-1.3}
      META_REVIEW_MODEL: ${META_REVIEW_MODEL:-muse-wonder-1.0}
      META_SAM_MODEL: ${META_SAM_MODEL:-sam-3.1}
      SAM_CONCURRENCY: ${SAM_CONCURRENCY:-10}
      SAM_MIN_CONFIDENCE: ${SAM_MIN_CONFIDENCE:-0.5}
      GEO_MIN_FITNESS: ${GEO_MIN_FITNESS:-0.9}
      GEO_MIN_COVERAGE: ${GEO_MIN_COVERAGE:-0.3}
      AGENT_HOST: "0.0.0.0"
    ports: ["8101:8101"]

  image-agent:
    build: { context: ., dockerfile: Dockerfile.inspection }
    command: ["python", "agent_service.py", "image", "8102"]
    environment: *agent-env
    ports: ["8102:8102"]

  pointcloud-agent:
    build: { context: ., dockerfile: Dockerfile.inspection }
    command: ["python", "agent_service.py", "pointcloud", "8103"]
    environment: *agent-env
    ports: ["8103:8103"]

  orchestrator:
    build: { context: ., dockerfile: Dockerfile.inspection }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      <<: *agent-env
      SERVICE_NAME: argus-inspection
      AGENT_TRANSPORT: http
      VIDEO_AGENT_URL: http://video-agent:8101
      IMAGE_AGENT_URL: http://image-agent:8102
      POINTCLOUD_AGENT_URL: http://pointcloud-agent:8103
      AGENT_JOBS_FILE: data/agent_jobs.json
    volumes:
      - argus-jobs:/app/src/services/inspection/data
    ports: ["8100:8100"]
    depends_on: [video-agent, image-agent, pointcloud-agent]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      PORT: "8000"
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env to your MongoDB Atlas connection string}
      # Local stack keeps its own database; the cloud deployment uses `argus`.
      # The API replaces whole collections on save, so two stacks must never share one.
      MONGODB_DB: ${MONGODB_DB:-argus-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOG_NAME: ${GCP_LOG_NAME:-argus}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: argus-api
      INSPECTION_SERVICE_URL: http://orchestrator:8100
      EVIDENCE_BASE_URL: http://api:8000
      ARGUS_INGEST_TOKEN: ${ARGUS_INGEST_TOKEN:-}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-6}
      VIDEO_ANALYSIS_EVERY: ${VIDEO_ANALYSIS_EVERY:-4}
      CLOSE_DRAIN_TIMEOUT_MS: ${CLOSE_DRAIN_TIMEOUT_MS:-120000}
      AUTO_CLOSE_MS: ${AUTO_CLOSE_MS:-5000}
      MAX_ORDER_UPLOAD_MB: ${MAX_ORDER_UPLOAD_MB:-25}
    volumes:
      - argus-data:/app/data
    ports: ["8000:8000"]
    depends_on:
      orchestrator: { condition: service_started }

volumes:
  argus-mongo:
  argus-data:
  argus-jobs:
